version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  main-server:
    build: ./server
    ports:
      - "3005:3005"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - redis
    volumes:
      - ./server/temp:/app/temp
      - ./server/tempHLS:/app/tempHLS
      - ./server/tempThumbnails:/app/tempThumbnails
      - ./server/uploads:/app/uploads

  transcoding-service:
    build: ./transcoding
    ports:
      - "3001:3001"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - redis
    volumes:
      - ./transcoding/temp:/app/temp
      - ./transcoding/tempHLS:/app/tempHLS
      - ./transcoding/tempThumbnails:/app/tempThumbnails
      - ./transcoding/uploads:/app/uploads

volumes:
  redis_data:
